name: Build & Deploy Jekyll (Polyglot)

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Configure Bundler (avoid deprecated --without)
        run: bundle config set --local without 'development test'

      - name: Prepare Jekyll cache directory
        run: mkdir -p /tmp/jekyll-cache

      - name: Build site
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_REPO_NWO: matmu/mm-github-pages-polyglot
          JEKYLL_CACHE_DIR: /tmp/jekyll-cache
          JEKYLL_POLYGLOT_PARALLEL: "false"
        run: |
          bundle install
          bundle exec jekyll build --trace --disable-disk-cache

      - name: Patch Minimal Mistakes GreedyNav language switch
        run: node tools/patch-greedy-nav-lang.js
        
      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
